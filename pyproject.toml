[project]
name = "vision-xai"
version = "0.1.0"
description = "Vision XAI Reliability Lab: attribution methods and their reliability, CNN vs ViT"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=1.26",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "captum>=0.7",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
vision-xai = "vision_xai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "httpx>=0.27",
]
# The Gradio demo is optional at runtime; the API works without it.
serve = ["gradio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_xai"]

[tool.uv]
default-groups = ["dev", "serve"]
# Always use a uv-managed, isolated interpreter (never a system Anaconda/conda
# install). On Windows, a bare (non-activated) venv built on an Anaconda base
# interpreter can pick up Anaconda's PATH/DLL search entries, which shadow
# torch's bundled OpenMP/MKL DLLs and break `import torch` with
# `OSError: [WinError 1114] ... loading c10.dll` — see FAILURES.md.
python-preference = "only-managed"

# torch/torchvision resolve from the PyTorch CPU index everywhere (local, CI, Docker).
# CUDA environments may install this package with `pip install . --no-deps`
# on top of a compatible preinstalled CUDA torch/torchvision pair.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "T20"]
ignore = [
    "PLR0913", # orchestration functions legitimately take >5 args
    "PLC0415", # lazy torch/torchvision imports keep CLI startup and --help fast
    "PLR0915", # sequential orchestration (train loop, Gradio UI wiring) reads
    # more clearly as one function than split across loosely-related helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic numbers are fine in test assertions

[tool.mypy]
# Analysis target is 3.12 because numpy>=2.5 ships PEP 695 `type` aliases in its
# stubs, which mypy only parses at >=3.12. Runtime support remains 3.11 (tests
# and CI run on 3.11); this project intentionally uses no 3.12-only syntax.
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torchvision.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# captum ships no py.typed and its internals confuse mypy when followed, and
# gradio registers event methods dynamically (mypy cannot see .click/.change);
# treat both as untyped boundaries (call sites annotate/cast the results).
[[tool.mypy.overrides]]
module = ["captum.*", "gradio.*"]
ignore_missing_imports = true
follow_imports = "skip"

# torchvision.transforms classes have untyped __init__ methods; relax only the
# one module that constructs them (risk R3 fallback: never repo-wide).
[[tool.mypy.overrides]]
module = ["vision_xai.data.transforms"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # makes the unpackaged app/ importable in tests
addopts = "-q --strict-markers"
markers = [
    "real_data: touches the real Oxford-IIIT Pet dataset (never run in CI)",
]
